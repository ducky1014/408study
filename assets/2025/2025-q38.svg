<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 850 390" role="img" aria-label="主机甲向主机乙发送 TCP 数据的部分过程时序图">
  <rect width="850" height="390" fill="#fff"/>
  <defs>
    <marker id="q38a" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
      <path d="M0,0 L12,6.5 L0,13" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round">
    <line x1="230" y1="55" x2="230" y2="370"/>
    <line x1="650" y1="55" x2="650" y2="370"/>
    <line x1="233" y1="90" x2="650" y2="140" marker-end="url(#q38a)"/>
