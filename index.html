<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ducky的408计算机学习 · 四门真题与考点</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230e7490'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>408</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7490">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ducky408">
<style>
:root{
  --accent:#0e7490; --accent2:#0891b2; --ink:#0f172a; --ink2:#334155; --mut:#64748b;
  --line:#e2e8f0; --bg:#f6f8fb; --card:#ffffff; --soft:#f1f5f9;
  --ds:#0e7490; --co:#6d28d9; --os:#c2410c; --ne:#047857;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
a{color:var(--accent);text-decoration:none}
img{max-width:100%}
/* ===== 布局 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;flex:0 0 auto;z-index:30}
.main{flex:1;min-width:0;padding:0 0 60px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
/* ===== 侧栏品牌 ===== */
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.brand .logo{font-size:17px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px}
.brand .logo .dot{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.brand .sub{font-size:12px;color:var(--mut);margin-top:5px}
.nav{padding:10px 12px 30px}
.navgroup{margin-bottom:2px}
.navtop{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;background:none;
  font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;border-radius:9px;text-align:left}
.navtop:hover{background:var(--soft)}
.navtop .bar{width:6px;height:18px;border-radius:3px;flex:0 0 auto}
.navtop .arrow{margin-left:auto;color:var(--mut);transition:transform .2s;font-size:11px}
.navgroup.open .navtop .arrow{transform:rotate(90deg)}
.navsub{display:none;padding:2px 0 6px 18px}
.navgroup.open .navsub{display:block}
.navchap{font-size:13px;font-weight:700;color:var(--ink);padding:6px 8px;display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;font-family:inherit;text-align:left;border-radius:7px;cursor:pointer}
.navchap:hover{background:var(--soft)}
.navchap .arrow{margin-left:auto;font-size:10px;color:var(--mut);transition:transform .2s}
.navchap-group.open>.navchap .arrow,.navyear-group.open>.navchap .arrow{transform:rotate(90deg)}
.navpoints{display:none;padding:2px 0 2px 14px}
.navchap-group.open>.navpoints,.navyear-group.open>.navpoints{display:block}
.navchap-group.active>.navchap,.navyear-group.active>.navchap{color:var(--accent);background:var(--soft)}
.navchap-group.active>.navchap .arrow,.navyear-group.active>.navchap .arrow{color:var(--accent)}
.navgroup.active>.navtop{color:var(--accent);background:var(--soft)}
.navlink{display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:var(--mut);padding:4px 8px;border-radius:7px}
.navlink:hover{color:var(--accent);background:var(--soft)}
.navlink.active{color:#fff;background:var(--accent)}
.navlink.active .n{color:#fff}
.navlink .n{color:var(--accent);font-weight:700;font-size:11px;flex:0 0 auto}
/* 年份真题题号宫格 */
.navyear-group.open>.navpoints.navq-grid{display:grid}
.navq-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:5px 4px 8px}
.navq{display:flex;align-items:center;justify-content:center;height:26px;padding:0;border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:5px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card);line-height:1}
.navq:hover{color:var(--accent);border-color:var(--accent);background:var(--soft)}
.navq.qs0{--c:var(--ds)}.navq.qs1{--c:var(--co)}.navq.qs2{--c:var(--os)}.navq.qs3{--c:var(--ne)}
.navq.qbig{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.navq.active,.navlink.navq.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.navchap .nycount{margin-left:6px;font-size:10px;font-weight:400;color:var(--mut);white-space:nowrap}
.dataload{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px 10px;text-align:center;color:var(--mut);font-size:13px}
.dl-spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:dlspin .8s linear infinite;flex:0 0 auto}
.dl-sec{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
@keyframes dlspin{to{transform:rotate(360deg)}}
/* 首次打开/GitHub 较慢时的启动等待页 */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .35s ease}
#boot.show{opacity:1;pointer-events:auto}
#boot.done{opacity:0;pointer-events:none}
.boot-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:28px 34px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);text-align:center;max-width:86vw}
.boot-spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:dlspin .8s linear infinite;margin-bottom:3px}
.boot-title{font-size:17px;font-weight:800;color:var(--ink)}
.boot-sub{font-size:12.5px;color:var(--mut);max-width:270px}
.boot-sec{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.boot-sec b{color:var(--accent)}
/* 移动端顶栏 */
.mbar{display:none;position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;align-items:center;gap:12px}
.mbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35}
/* ===== Hero ===== */
.hero{padding:54px 0 30px;background:linear-gradient(180deg,#ecfeff 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero .kicker{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.hero h1{font-size:34px;line-height:1.25;margin:10px 0 12px;font-weight:800}
.hero p.lead{color:var(--ink2);font-size:15.5px;max-width:760px;margin:0 0 20px}
.hero .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.hero .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow)}
.hero .stat b{font-size:22px;display:block;color:var(--accent)}
.hero .stat span{font-size:12.5px;color:var(--mut)}
.hero .stat small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
/* ===== 区块标题 ===== */
section.block{padding:40px 0 8px}
.sec-head{margin-bottom:18px}
.sec-kicker{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.6px}
.sec-title{font-size:26px;font-weight:800;margin:6px 0 8px}
.sec-sub{font-size:14px;color:var(--mut);margin:0;max-width:800px}
/* ===== 真题年份折叠 ===== */
.year{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.year-head{width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;border:0;background:var(--card);cursor:pointer;text-align:left}
.year-head .yn{font-size:19px;font-weight:800;color:var(--accent);flex:0 0 auto}
.year-head .ymeta{font-size:13px;color:var(--mut)}
.year-head .arrow{margin-left:auto;transition:transform .2s;color:var(--mut)}
.year.open .year-head .arrow{transform:rotate(180deg)}
.year-body{display:none;padding:4px 18px 18px}
.year.open .year-body{display:block}
.subj-band{display:flex;align-items:center;gap:9px;margin:16px 0 10px;font-size:15px;font-weight:800}
.subj-band .bar{width:7px;height:20px;border-radius:4px}
/* 题目卡片 */
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:11px;background:var(--card)}
.qcard .qno{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 7px;border-radius:7px;
  background:var(--soft);color:var(--ink2);font-size:12.5px;font-weight:800;margin-right:8px}
.qstem{font-size:14.5px}
.qstem p{margin:8px 0}
.qstem pre{background:#fff;color:var(--ink);padding:13px 15px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.6;margin:10px 0}
.qstem pre code{font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--ink);white-space:pre}
.qimg,.qstem img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:10px auto;background:#fff;cursor:zoom-in}
.qimg.fit-v,.qstem img.fit-v{max-width:min(100%,440px)}
.qimg.fit-sq,.qstem img.fit-sq{max-width:min(100%,480px)}
.qimg.fit-mid,.qstem img.fit-mid{max-width:min(100%,580px)}
.qimg.fit-wide,.qstem img.fit-wide{max-width:min(100%,700px)}
.qimg.fit-xwide,.qstem img.fit-xwide{max-width:min(100%,820px)}
.qimg.fit-strip,.qstem img.fit-strip{max-width:min(100%,880px)}
/* 点击真题图片放大查看 */
.img-zoom{position:fixed;inset:0;z-index:9999;background:rgba(6,10,18,.86);display:none;align-items:center;justify-content:center;padding:3vh 2vw;cursor:zoom-out}
.img-zoom.on{display:flex}
.img-zoom img{max-width:96vw;max-height:92vh;width:auto;height:auto;border-radius:8px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.img-zoom span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12.5px;color:#dfe7f5;opacity:.82;pointer-events:none}
html[data-theme="dark"] .img-zoom img{filter:invert(1) hue-rotate(180deg)}
.fm{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px;background:var(--soft);padding:1px 6px;border-radius:6px;white-space:nowrap}
.qstem table,.ans-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
.qstem th,.qstem td,.ans-body th,.ans-body td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.ans-body table{table-layout:auto}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
.table-wrap>table{margin:0}
.qstem th{background:var(--soft)}
.qopts{list-style:none;margin:12px 0 4px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 选项里是多行代码时，每个选项独占一行，代码保留换行与缩进 */
.qopts.qopts-code{grid-template-columns:1fr}
.qopt-btn pre{margin:7px 0 0;background:var(--soft);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;overflow-x:auto;font-size:12.5px;line-height:1.55}
.qopt-btn pre code{font-family:"SF Mono",Menlo,Consolas,monospace;color:var(--ink);white-space:pre}
.qopt-note{font-size:13px;color:var(--mut);margin:10px 0 0}
.qopts li{font-size:14px}
.qopt-btn{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s;font-family:inherit}
.qopt-btn .k{font-weight:800;color:var(--accent);margin-right:6px}
.qopt-btn:hover:not(:disabled){border-color:var(--accent);background:#f0fdfa}
.qopt-btn:disabled{cursor:default}
.qopt-btn.opt-correct{border-color:#16a34a;background:#dcfce7;color:#15803d}
.qopt-btn.opt-correct .k{color:#15803d}
.qopt-btn.opt-wrong{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.qopt-btn.opt-wrong .k{color:#b91c1c}
.qresult{margin-top:4px}
.qok{font-size:13.5px;font-weight:800;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:7px 12px}
.qbad{font-size:13.5px;font-weight:800;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:7px 12px}
details.ans{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
details.ans summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--accent);padding:7px 0;list-style:none}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::before{content:"▸ ";font-size:11px}
details.ans[open] summary::before{content:"▾ "}
.ans-body{font-size:14px;padding:2px 0 6px}
.ans-body p{margin:8px 0}
.ans-badge{display:inline-block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-weight:800;border-radius:7px;padding:2px 10px;font-size:13px;margin-right:8px}
/* ===== 知识点 ===== */
.kp-subj{margin-bottom:10px}
.kp-chapter{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.kp-ch-head{display:flex;align-items:center;gap:11px;padding:15px 18px;cursor:pointer}
.kp-ch-head .cn{font-size:16px;font-weight:800}
.kp-ch-head .cmeta{font-size:12.5px;color:var(--mut)}
.kp-ch-head .arrow{margin-left:auto;color:var(--mut);transition:transform .2s}
.kp-chapter.open .kp-ch-head .arrow{transform:rotate(180deg)}
.kp-ch-body{display:none;padding:2px 18px 18px}
.kp-chapter.open .kp-ch-body{display:block}
.pitem{border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:12px}
.pitem h4{margin:0 0 9px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.freq{font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px}
.psec{margin:9px 0}
.psec-t{font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:4px}
.pitem p{margin:7px 0;font-size:14px}
.pitem ul,.pitem ol{margin:7px 0;padding-left:22px;font-size:14px}
.pitem li{margin:4px 0}
.pitem table{border-collapse:collapse;width:100%;margin:9px 0;font-size:13px}
.pitem th,.pitem td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.pitem th{background:var(--soft)}
.pitem pre{background:#fff;color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-size:12.5px;margin:9px 0}
.pitem pre code{white-space:pre}
.note{border-radius:10px;padding:10px 13px;margin:10px 0;font-size:13.5px;display:flex;gap:10px}
.note.warn{background:#fffbeb;border:1px solid #fde68a}
.note.key{background:#ecfeff;border:1px solid #a5f3fc}
.note .ic{flex:0 0 auto;font-weight:800;color:var(--accent)}
.quick-memo{background:linear-gradient(135deg,#f0f9ff,#ecfeff);border:1px solid #bae6fd;border-radius:12px;padding:14px 16px;margin-top:14px}
.quick-memo h5{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--accent)}
.quick-memo ul{margin:0;padding-left:20px;font-size:13.5px}
.quick-memo li{margin:5px 0}
.aoe-wrap{margin:10px 0;overflow-x:auto}
.aoe-wrap svg{display:block;width:100%;min-width:560px;height:auto}
.aoe-wrap .e{stroke:var(--ink2);stroke-width:1.6;fill:none}
.aoe-wrap .k{stroke:var(--accent);stroke-width:2.4;fill:none}
.aoe-wrap .nc{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.aoe-wrap .nt{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle}
.aoe-wrap .el{fill:var(--ink2);font-size:14px;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round}
.aoe-wrap .el.k{fill:var(--accent);font-weight:700}
.aoe-cap{font-size:12.5px;color:var(--mut);margin:4px 0 10px}
.quick-memo .qm-h{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--accent)}
.quick-memo .qm-b h3{margin:8px 0 6px;font-size:14.5px}
.quick-memo .tbl-wrap{margin:6px 0;overflow-x:auto}
.quick-memo table{border-collapse:collapse;width:100%;margin:6px 0;font-size:13px}
.quick-memo th,.quick-memo td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.quick-memo th{background:var(--soft);white-space:nowrap}
/* ===== 流程图 ===== */
.flow-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.flow-layer{display:flex;gap:14px;align-items:stretch;margin-bottom:10px}
.flow-tag{flex:0 0 110px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;padding:12px}
.flow-content{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:13.5px;background:var(--soft)}
.flow-arrow{text-align:center;color:var(--mut);font-size:16px;margin:-4px 0}
/* ===== 页脚 ===== */
footer{border-top:1px solid var(--line);margin-top:50px;padding:28px 0;background:var(--card)}
.foot{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot b{color:var(--ink2)}
.foot a{color:var(--accent)}
/* ===== 锚点定位边距（避免被吸顶栏遮挡） ===== */
.qcard,.year,.kp-chapter,.pitem,.kp-subj{scroll-margin-top:18px}
/* ===== 响应式 ===== */
@media (max-width:900px){
  .mbar{display:flex}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;width:270px;z-index:45}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;z-index:35}
  .hero h1{font-size:27px}
  .qopts{grid-template-columns:1fr}
  .flow-tag{flex-basis:78px;font-size:12.5px}
  .wrap{padding:0 18px}
  .fm,code,.qopt-btn{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
  .qcard table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
  .qcard table th,.qcard table td{white-space:normal}
  .qimg,.qstem img{max-width:100%;margin:8px auto}
  .qimg[class*="fit-"],.qstem img[class*="fit-"]{max-width:100%}
}
/* ===== 深色模式（data-theme 控制，默认跟随系统）===== */
html[data-theme="dark"]{
  --accent:#22d3ee; --accent2:#06b6d4; --ink:#e2e8f0; --ink2:#cbd5e1; --mut:#94a3b8;
  --line:#243044; --bg:#0b1220; --card:#111c2e; --soft:#1c2940;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
html[data-theme="dark"] .hero{background:linear-gradient(180deg,#0c2431 0%,var(--bg) 100%)}
html[data-theme="dark"] .qstem pre,html[data-theme="dark"] .pitem pre{background:#0d1729;border-color:var(--line)}
html[data-theme="dark"] .qimg,html[data-theme="dark"] .qstem img{background:#0d1729;filter:invert(1) hue-rotate(180deg)}
html[data-theme="dark"] .qopt-btn:hover:not(:disabled){background:#0f2a33}
html[data-theme="dark"] .qopt-btn.opt-correct{background:rgba(22,163,74,.18);border-color:#16a34a;color:#4ade80}
html[data-theme="dark"] .qopt-btn.opt-correct .k{color:#4ade80}
html[data-theme="dark"] .qopt-btn.opt-wrong{background:rgba(220,38,38,.18);border-color:#dc2626;color:#f87171}
html[data-theme="dark"] .qopt-btn.opt-wrong .k{color:#f87171}
html[data-theme="dark"] .qok{background:rgba(22,163,74,.15);border-color:#166534;color:#4ade80}

<script>
(function(){
  var t0=Date.now(), left=7;
  var boot=document.getElementById('boot');
  var sec=document.getElementById('bootSec');
  // 本地/缓存命中时通常 250ms 内就渲染完成，避免等待页一闪而过
  var showT=setTimeout(function(){ if(boot) boot.classList.add('show'); },250);
  window.__bootTimer=setInterval(function(){
    var n=Math.floor((Date.now()-t0)/1000);
    if(!sec) return;
    if(left>0){
      sec.innerHTML='预计 <b>'+left+'</b> 秒 · 已等待 '+n+' 秒';
      left--;
    }else{
      sec.innerHTML='仍在加载，已等待 <b>'+n+'</b> 秒';
    }
    if(n>=12){
      var sub=document.querySelector('.boot-sub');
      if(sub&&!sub.dataset.slow){
        sub.dataset.slow='1';
        sub.textContent='GitHub 访问较慢，正在继续下载，请不要关闭页面';
      }
    }
  },1000);
  window.__bootDone=function(){
    clearInterval(window.__bootTimer);
    clearTimeout(showT);
    var b=document.getElementById('boot');
    if(!b) return;
    b.classList.add('done');
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },400);
    document.documentElement.classList.add('ready');
  };
})();
</script>

const __dataP={};
function loadScript(src){
  if(!__dataP[src]) __dataP[src]=new Promise((res,rej)=>{
    const el=document.createElement('script');
    el.src=src; el.async=true;
    el.onload=()=>res();
    el.onerror=()=>{ delete __dataP[src]; rej(new Error('load '+src)); };
    document.head.appendChild(el);
  });
  return __dataP[src];
}

function lazyImg(h){
  return String(h||'').replace(/<img\b([^>]*)>/g,function(tag,attrs){
    if(/\bloading=/.test(attrs)) return tag;
    const a=attrs.replace(/\/\s*$/,'');
    let add=' loading="lazy" decoding="async" title="点击查看大图"';
    const m=/src="assets\/(?:[^"\/]+\/)?([^"\/]+)"/.exec(a);

    if(key&&IMG_DIM[key]) add+=' width="'+IMG_DIM[key][0]+'" height="'+IMG_DIM[key][1]+'"';
    return '<img'+a+add+'>';
  });
}

function wrapTables(root){
  if(!root) return;
  root.querySelectorAll('table').forEach(function(t){
    if(t.parentElement&&t.parentElement.classList.contains('table-wrap')) return;
    const w=document.createElement('div');
    w.className='table-wrap';
    t.parentNode.insertBefore(w,t);
    w.appendChild(t);
  });
}

    const items=q.opts.map(o=>{
      const k=o.charAt(0);
      const rest=o.replace(/^[A-D]\.\s*/,'');
      return '<li>'+
        '<button type="button" class="qopt-btn" data-key="'+k+'">'+
          '<span class="k">'+k+'.</span>'+
          rest+
        '</button>'+

    q.explain;

  return '<div class="qcard" id="q-'+year+'-'+q.no+'" data-ans="'+(q.ans||'')+'">'+
    '<div class="qstem">'+
      '<span class="qno">'+(isBig?'第'+q.no+'题':q.no)+'</span>'+
      lazyImg(q.stem)+
    '</div>'+
    opts+
    '<div class="qresult"></div>'+
    '<details class="ans">'+
      '<summary>'+sum+'</summary>'+
      '<div class="ans-body">'+lazyImg(ansBody)+'</div>'+
    '</details>'+
  '</div>';
}

      [/串|KMP|模式匹配/,'串'],
      [/线性表|链表|顺序表/,'线性表'],
      [/数组|矩阵|稀疏/,'数组'],
      [/复杂度/,'复杂度']
    ],
    '组成原理':[
      [/浮点|补码|原码|反码|移码|定点|溢出|IEEE|整型|int 型|short 型|符号扩展/,'数据表示'],
      [/冯.诺依曼|指令周期/,'CPU'],
      [/Cache|缓存|主存|存储器|虚拟存储|页式|段式|磁盘|RAID/,'存储'],
      [/指令|寻址|操作码|RISC|CISC|汇编/,'指令系统'],
      [/流水线|数据通路|控制器|寄存器|CPU|中断/,'CPU'],
      [/总线/,'总线'],
      [/I\/O|DMA|设备|接口|打印/,'I/O'],
      [/CPI|主频|MIPS|性能/,'性能']
    ],
    '操作系统':[
      [/进程|线程|调度|同步|互斥|PV|信号量|死锁|银行家/,'进程'],
      [/内存|分页|分段|页面|缺页|虚拟|TLB|地址转换/,'内存'],
      [/文件|目录|inode|FAT|索引/,'文件'],
      [/I\/O|设备|缓冲|SPOOLing|磁盘调度/,'I/O'],
      [/概述|特征|内核|系统调用|启动|引导/,'概述']
    ],
    '计算机网络':[
      [/体系结构|OSI|TCP\/IP|分层|封装/,'体系结构'],
      [/物理层|编码|调制|传输介质|奈氏|香农/,'物理层'],
      [/链路层|以太网|MAC|CSMA|PPP|交换机|网桥|CRC|帧/,'链路层'],
      [/网络层|IP|路由|子网|CIDR|ARP|ICMP|NAT|组播/,'网络层'],
      [/传输层|TCP|UDP|拥塞|流量|端口|握手/,'传输层'],
      [/应用层|HTTP|DNS|FTP|SMTP|POP3|DHCP|WWW|邮件/,'应用层']

  };

/* ========== 事件绑定 ========== */
function bind(){
  // 选择题交互判分（事件委托）
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.qopt-btn');
    if(!btn) return;

    const card=btn.closest('.qcard');
    if(!card||card.dataset.done) return;
    card.dataset.done='1';

    const correct=card.dataset.ans;
    const chosen=btn.dataset.key;

    // 禁用所有选项，并标出正确答案
    card.querySelectorAll('.qopt-btn').forEach(b=>{
      b.disabled=true;
      if(b.dataset.key===correct){
        b.classList.add('opt-correct');
      }
    });

    // 选错时把所选项标红
    if(chosen!==correct){
      btn.classList.add('opt-wrong');
    }

    // 显示判分结果
    const result=card.querySelector('.qresult');
    if(chosen===correct){
      result.innerHTML='<div class="qok">回答正确</div>';
    }else{
      result.innerHTML='<div class="qbad">回答错误，标准答案为 '+correct+'</div>';
    }

    // 自动展开答案解析
    const d=card.querySelector('details.ans');
    if(d){
      d.open=true;
    }
  });
  // 正文手风琴：打开一个年份/章节时，收起其他已展开的年份/章节
  function closeOtherYears(except){
    document.querySelectorAll('.year.open').forEach(x=>{ if(x!==except) x.classList.remove('open'); });
  }
  function closeOtherChapters(except){
    document.querySelectorAll('.kp-chapter.open').forEach(x=>{ if(x!==except) x.classList.remove('open'); });
  }
  // 年份折叠（同步导航展开/标记）
  document.querySelectorAll('.year-head').forEach(b=>b.addEventListener('click',()=>{
    const el=b.parentElement, opening=!el.classList.contains('open');
    if(opening){ closeOtherYears(el); closeOtherChapters(null); }
    if(opening) ensureYearBody(el.id.replace('year-',''));
    el.classList.toggle('open');
    if(opening) activateYear(el.id.replace('year-',''));
    else document.querySelectorAll('.navyear-group.active').forEach(x=>x.classList.remove('active'));
    requestAnimationFrame(()=>spyUpdate());
  }));
  // 知识点章节折叠（同步导航展开/标记）
  document.querySelectorAll('.ch-toggle').forEach(b=>b.addEventListener('click',()=>{
    const el=b.parentElement, opening=!el.classList.contains('open');
    if(opening){ closeOtherChapters(el); closeOtherYears(null); }
    if(opening) ensureChapterBody(el.id);
    el.classList.toggle('open');
    if(opening) activateChapter(el.id);
    else{
      const g=document.querySelector('.navchap-group[data-target="'+el.id+'"]');
      if(g) g.classList.remove('active','open');
    }
    requestAnimationFrame(()=>spyUpdate());
  }));
  // 导航分组展开
  function closeNavGroup(g){
    g.classList.remove('open');
    g.querySelectorAll('.navchap-group.open,.navyear-group.open').forEach(x=>x.classList.remove('open'));
  }
  function openNavGroup(book){
    if(!book||book.classList.contains('open')) return;
    document.querySelectorAll('.navgroup.open').forEach(x=>{ if(x!==book) closeNavGroup(x); });
    book.classList.add('open');
  }
  function revealNav(el){
    const sb=document.querySelector('.sidebar');
    if(!sb||!el) return;
    const r=el.getBoundingClientRect(), sr=sb.getBoundingClientRect();
    if(r.top>=sr.top+8&&r.bottom<=sr.bottom-8) return;
    sb.scrollTop=Math.max(0,sb.scrollTop+r.top-sr.top-80);
  }
  function activateChapter(cid){
    document.querySelectorAll('.navchap-group.active,.navyear-group.active').forEach(x=>x.classList.remove('active'));
    const g=document.querySelector('.navchap-group[data-target="'+cid+'"]');
    if(!g) return;
    openNavGroup(g.closest('.navgroup'));
    if(!g.classList.contains('open')){
      document.querySelectorAll('.navchap-group.open,.navyear-group.open').forEach(x=>{ if(x!==g) x.classList.remove('open'); });
      g.classList.add('open');
    }
    g.classList.add('active');
    requestAnimationFrame(()=>revealNav(g));
  }
  function activateYear(y){
    document.querySelectorAll('.navchap-group.active,.navyear-group.active').forEach(x=>x.classList.remove('active'));
    const g=document.querySelector('.navyear-group[data-year="'+y+'"]');
    if(!g) return;
    openNavGroup(g.closest('.navgroup'));
    if(!g.classList.contains('open')){
      document.querySelectorAll('.navchap-group.open,.navyear-group.open').forEach(x=>{ if(x!==g) x.classList.remove('open'); });
      g.classList.add('open');
    }
    g.classList.add('active');
    requestAnimationFrame(()=>revealNav(g));
  }
  // 懒加载占位：转圈 + 已等待秒数；超过 6 秒提示网络较慢
  function loadingBox(el,label){
    const started=Date.now();
    el.innerHTML='<div class="dataload"><span class="dl-spin" aria-hidden="true"></span><span class="dl-txt">'+label+'</span><span class="dl-sec">已等待 0 秒</span></div>';
    const sec=el.querySelector('.dl-sec');
    const id=setInterval(function(){
      if(!sec||!document.body.contains(sec)){ clearInterval(id); return; }
      const n=Math.floor((Date.now()-started)/1000);
      sec.textContent='已等待 '+n+' 秒'+(n>=6?' · 网络较慢，请稍候':'');
    },1000);
    return {stop:function(){ clearInterval(id); }};
  }
  const __bodyP={};
  function ensureYearBody(y){
    const key='y'+y;
    if(__bodyP[key]) return __bodyP[key];
    __bodyP[key]=(async()=>{
      const yEl=document.getElementById('year-'+y);
      if(!yEl) return;
      const body=yEl.querySelector('.year-body');
      if(!body||body.dataset.rendered) return;
      const box=loadingBox(body,'正在加载 '+y+' 年真题…');
      try{
        await ensureYearData(y);
        body.innerHTML=renderYearBody(y);
        wrapTables(body);
        body.dataset.rendered='1';
      }catch(err){
        body.innerHTML='<div class="dataload">加载失败，请检查网络后刷新重试</div>';
        delete __bodyP[key];
      }finally{
        box.stop();
      }
    })();
    return __bodyP[key];
  }
  function ensureChapterBody(cid){
    const key='c'+cid;
    if(__bodyP[key]) return __bodyP[key];
    __bodyP[key]=(async()=>{
      const c=document.getElementById(cid);
      if(!c) return;
      const body=c.querySelector('.kp-ch-body');
      if(!body||body.dataset.rendered) return;
      const m=/^kp-(\d+)-(\d+)$/.exec(cid);
      if(!m) return;
      const box=loadingBox(body,'正在加载本章考点…');
      try{
        await ensureKnowData(SUBJECTS[+m[1]]);
        body.innerHTML=renderChapterBody(cid);
        wrapTables(body);
        body.dataset.rendered='1';
      }catch(err){
        body.innerHTML='<div class="dataload">加载失败，请检查网络后刷新重试</div>';
        delete __bodyP[key];
      }finally{
        box.stop();
      }
    })();
    return __bodyP[key];
  }
  // 导航分组：同层手风琴，只保留一个展开
  document.querySelectorAll('.ng-toggle').forEach(b=>b.addEventListener('click',()=>{
    const g=b.parentElement, isOpen=g.classList.contains('open');
    if(isOpen){ closeNavGroup(g); }
    else{
      document.querySelectorAll('.navgroup.open').forEach(x=>{ if(x!==g) closeNavGroup(x); });
      g.classList.add('open');
    }
  }));
  // 导航章节/年份：同层手风琴，只保留一个展开
  document.querySelectorAll('.navchap-toggle,.navyear-toggle').forEach(b=>b.addEventListener('click',()=>{
    const g=b.parentElement, isOpen=g.classList.contains('open');
    if(isOpen){ g.classList.remove('open'); }
    else{
      document.querySelectorAll('.navchap-group.open,.navyear-group.open').forEach(x=>{ if(x!==g) x.classList.remove('open'); });
      g.classList.add('open');
    }
  }));
  // 导航滚动
  document.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>{
    document.getElementById(b.dataset.scroll).scrollIntoView();
  }));
  // 导航链接：先展开目标所在的年份/章节
  document.querySelectorAll('.navlink').forEach(a=>a.addEventListener('click',async()=>{
    const id=(a.getAttribute('href')||'').replace(/^#/,'');
    if(!id) return;
    if(id.indexOf('q-')===0){ await ensureYearBody(id.split('-')[1]); }
    else if(id.indexOf('kp-')===0){
      const m=/^kp-(\d+)-(\d+)/.exec(id);
      if(m) await ensureChapterBody('kp-'+m[1]+'-'+m[2]);
    }
    const el=document.getElementById(id);
    if(!el) return;
    const y=el.closest('.year');
    if(y){ closeOtherYears(y); closeOtherChapters(null); if(!y.classList.contains('open')) y.classList.add('open'); activateYear(y.id.replace('year-','')); }
    const ch=el.closest('.kp-chapter');
    if(ch){ closeOtherChapters(ch); closeOtherYears(null); if(!ch.classList.contains('open')) ch.classList.add('open'); activateChapter(ch.id); }
  }));
  // 移动端菜单
  const body=document.body, navEl=document.getElementById('nav');
  const isMobile=()=>window.matchMedia('(max-width:900px)').matches;
  function closeDrawer(){ body.classList.remove('nav-open'); } // 只关抽屉，保留导航分组展开（常驻）
  document.getElementById('menuBtn').addEventListener('click',()=>body.classList.add('nav-open'));
  document.getElementById('scrim').addEventListener('click',closeDrawer);
  /* 主题手动切换：浅色/深色循环并记忆；未手动选过时仍跟随系统 */
  const themeBtns=[document.getElementById('themeBtn'),document.getElementById('themeBtnM')].filter(Boolean);
  function paintIcon(){
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    const label=dark?'切换浅色模式':'切换深色模式';
    themeBtns.forEach(b=>{
      b.textContent=dark?'☀️':'🌙';
      b.setAttribute('aria-label',label);
      b.setAttribute('title',label);
      b.setAttribute('aria-pressed',dark?'true':'false');
    });
  }
  paintIcon();
  themeBtns.forEach(b=>b.addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
    window.__themeManual=true; paintIcon();
  }));
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
      if(!window.__themeManual){
        document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');
        paintIcon();
      }
    });
  }
  // 统一导航点击：展开目标折叠容器 → 精准定位；导航分组保持常驻不自动收叠
  navEl.addEventListener('click',async e=>{
    const a=e.target.closest('a'); if(!a) return;
    e.preventDefault();
    const id=(a.getAttribute('href')||'').slice(1);
    if(id.indexOf('q-')===0) await ensureYearBody(id.split('-')[1]);
    else if(id.indexOf('kp-')===0){
      const mm=/^kp-(\d+)-(\d+)/.exec(id);
      if(mm) await ensureChapterBody('kp-'+mm[1]+'-'+mm[2]);
    }
    let target;
    if(a.classList.contains('year-link')){
      target=document.getElementById('year-'+a.dataset.year);
      if(target){ closeOtherYears(target); closeOtherChapters(null); target.classList.add('open'); }
    }else{
      target=document.getElementById(id);
      const y=target&&target.closest('.year');
      if(y){ closeOtherYears(y); closeOtherChapters(null); y.classList.add('open'); }
      const ch=target&&target.closest('.kp-chapter');
      if(ch){ closeOtherChapters(ch); closeOtherYears(null); ch.classList.add('open'); } // 章节收起时先自动展开
    }
    if(!target) return;
    if(isMobile()) closeDrawer();
    // 双 rAF 等折叠展开、布局更新后再精准滚动
    requestAnimationFrame(()=>requestAnimationFrame(()=>target.scrollIntoView({block:'start',behavior:'smooth'})));
    setTimeout(()=>spyUpdate(),400);
  });
  // 带 #锚点 直接打开时，按需渲染并展开对应年份/章节
  async function revealHash(){
    const id=(location.hash||'').slice(1); if(!id) return;
    let target=null;
    if(id.indexOf('q-')===0){
      const y=id.split('-')[1];
      await ensureYearBody(y);
      const yEl=document.getElementById('year-'+y);
      if(yEl){ closeOtherYears(yEl); closeOtherChapters(null); yEl.classList.add('open'); activateYear(y); target=document.getElementById(id); }
    }else if(id.indexOf('kp-')===0){
      const m=/^kp-(\d+)-(\d+)(?:-(\d+))?$/.exec(id);
      if(m){
        const cid='kp-'+m[1]+'-'+m[2];
        if(m[3]!==undefined) await ensureChapterBody(cid);
        const ch=document.getElementById(cid);
        if(ch){ closeOtherChapters(ch); closeOtherYears(null); ch.classList.add('open'); activateChapter(cid); }
        target=document.getElementById(id)||ch;
      }
    }
    if(target){ requestAnimationFrame(()=>target.scrollIntoView({block:'start'})); setTimeout(()=>spyUpdate(),350); }
  }
  window.addEventListener('hashchange',revealHash);
  setTimeout(revealHash,0);
  /* ===== 滚动定位：左侧导航实时标记当前浏览的年份 / 章节 / 题目 ===== */
  let spyKey='';
  function spyFind(){
    const probe=Math.min(170,Math.max(90,window.innerHeight*0.2));
    let best=null,bestTop=-Infinity;
    document.querySelectorAll('.year.open,.year.open .qcard,.kp-chapter.open,.kp-chapter.open .pitem').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.top<=probe&&r.top>bestTop){ best=el; bestTop=r.top; }
    });
    return best;
  }
  function spyClear(){
    document.querySelectorAll('.navlink.active').forEach(a=>a.classList.remove('active'));
    document.querySelectorAll('.navgroup.active,.navyear-group.active,.navchap-group.active').forEach(x=>x.classList.remove('active'));
  }
  function spyMarkYear(y,link){
    const g=document.querySelector('.navyear-group[data-year="'+y+'"]');
    if(!g) return;
    openNavGroup(g.closest('.navgroup'));
    document.querySelectorAll('.navyear-group.open,.navchap-group.open').forEach(x=>{ if(x!==g) x.classList.remove('open'); });
    g.classList.add('open','active');
    const book=g.closest('.navgroup'); if(book) book.classList.add('active');
    if(link){ link.classList.add('active'); requestAnimationFrame(()=>revealNav(link)); }
  }
  function spyMarkChapter(cid,link){
    const g=document.querySelector('.navchap-group[data-target="'+cid+'"]');
    if(!g) return;
    openNavGroup(g.closest('.navgroup'));
    document.querySelectorAll('.navyear-group.open,.navchap-group.open').forEach(x=>{ if(x!==g) x.classList.remove('open'); });
    g.classList.add('open','active');
    const book=g.closest('.navgroup'); if(book) book.classList.add('active');
    if(link){ link.classList.add('active'); requestAnimationFrame(()=>revealNav(link)); }
  }
  function spyMark(el){
    if(!el) return;
    spyClear();
    const id=el.id;
    if(id.indexOf('q-')===0){
      spyMarkYear(id.split('-')[1],document.querySelector('.navq[href="#'+id+'"]'));
    }else if(id.indexOf('year-')===0){
      spyMarkYear(id.slice(5),null);
    }else if(/^kp-\d+-\d+$/.test(id)){
      spyMarkChapter(id,null);
    }else if(/^kp-\d+-\d+-\d+$/.test(id)){
      const m=/^(kp-\d+-\d+)-\d+$/.exec(id);
      spyMarkChapter(m[1],document.querySelector('.navlink[href="#'+id+'"]'));
    }
  }
  function spyUpdate(){
    if(document.body.classList.contains('nav-open')) return; // 移动端抽屉打开时暂停联动
    const el=spyFind();
    const key=el?el.id:'';
    if(!key||key===spyKey) return;
    spyKey=key;
    spyMark(el);
  }
  let spyTick=false;
  window.addEventListener('scroll',()=>{
    if(spyTick) return;
    spyTick=true;
    requestAnimationFrame(()=>{ spyTick=false; spyUpdate(); });
  },{passive:true});
  window.addEventListener('resize',()=>requestAnimationFrame(spyUpdate));
  requestAnimationFrame(spyUpdate);
  // 点击真题/考点图片放大，Esc 或点击空白处关闭
  const zoom=document.createElement('div');
  zoom.className='img-zoom';
  zoom.innerHTML='<img alt=""><span>点击图片外或按 Esc 关闭</span>';
  document.body.appendChild(zoom);
  const zoomImg=zoom.querySelector('img');
  function closeZoom(){ zoom.classList.remove('on'); document.body.style.overflow=''; }
  document.addEventListener('click',e=>{
    const im=e.target.closest('.qcard img,.pitem img');
    if(!im) return;
    zoomImg.src=im.currentSrc||im.src;
    zoomImg.alt=im.alt||'';
    zoom.classList.add('on');
    document.body.style.overflow='hidden';
  });
  zoom.addEventListener('click',closeZoom);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeZoom(); });
}

/* ========== 启动 ========== */
renderNav();
renderHero();
document.querySelector('main > footer').insertAdjacentHTML('beforebegin',
  renderExam()+renderPoints());
renderFoot();
fixXlinkImages();
bind();
/* 首屏内容已渲染，淡出启动等待页 */
requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(window.__bootDone) window.__bootDone(); }); });

</script>
<script>
/* Service Worker：内容更新后新版本接管时自动刷新页面，无需手动刷新 */
(function(){
  if (!('serviceWorker' in navigator)) return;
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;

  // 新版本激活并接管当前页面时，自动重载一次拿到新内容
  // （首次访问安装时 hadController 为 false，不会触发多余刷新）
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      // 回到前台时、以及每隔 30 分钟检查一次是否有新版本
      function checkUpdate(){
        if (document.visibilityState !== 'visible' || !navigator.onLine) return;
        reg.update().catch(function(){});
      }
      document.addEventListener('visibilitychange', checkUpdate);
      setInterval(checkUpdate, 30 * 60 * 1000);
      checkUpdate();
    }).catch(function(){});
  });
})();
</script>
